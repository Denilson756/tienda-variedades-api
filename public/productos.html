<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Tienda de Variedades</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <h1>Gestión de Productos</h1>

  <!-- ===== FORMULARIO PARA CREAR UN PRODUCTO NUEVO ===== -->
  <form id="form-producto">
    <!-- Un input "hidden" (oculto) que vamos a usar para saber si estamos
         CREANDO un producto nuevo o EDITANDO uno existente.
         Cuando esté vacío = modo crear. Cuando tenga un id = modo editar.
         Esto nos evita tener que hacer dos formularios distintos. -->
    <input type="hidden" id="productoId">

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" required>

    <label for="descripcion">Descripción:</label>
    <input type="text" id="descripcion">
    <!-- Sin "required" porque en tu modelo de Mongoose, descripcion NO es obligatoria -->

    <label for="precio">Precio:</label>
    <input type="number" id="precio" required>
    <!-- type="number" hace que el navegador solo permita escribir números -->

    <label for="categoria">Categoría:</label>
    <input type="text" id="categoria" required>

    <button type="submit" id="btn-guardar">Crear producto</button>
    <!-- El texto de este botón lo vamos a cambiar dinámicamente a "Guardar cambios"
         cuando estemos en modo edición, desde el JS -->
  </form>

  <p id="mensaje-producto"></p>

  <hr>

  <!-- ===== TABLA DE PRODUCTOS EXISTENTES ===== -->
  <table id="tabla-productos">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Categoría</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="cuerpo-tabla-productos">
      <!-- Aquí NO escribimos filas a mano. Este <tbody> va a quedar vacío
           en el HTML, porque las filas las va a generar login... digo,
           productos.js dinámicamente con JavaScript, según lo que devuelva
           el GET de tu API. Por eso tiene un id: para que JS sepa dónde
           insertar las filas. -->
    </tbody>
  </table>

  <script src="js/productos.js"></script>

</body>
</html>
