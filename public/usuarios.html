<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - Tienda de Variedades</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <h1>Gestión de Usuarios</h1>

  <!-- Formulario SOLO para editar (no hay modo "crear" en esta página) -->
  <form id="form-usuario">
    <input type="hidden" id="usuarioId">

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" required>

    <label for="correo">Correo:</label>
    <input type="email" id="correo" required>

    <button type="submit">Guardar cambios</button>
    <!-- Aquí el texto no cambia dinámicamente como en productos,
         porque esta página SIEMPRE está en modo edición, nunca en modo crear -->
  </form>

  <p id="mensaje-usuario"></p>

  <hr>

  <table id="tabla-usuarios">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="cuerpo-tabla-usuarios">
      <!-- Igual que en productos: JS llena esto dinámicamente -->
    </tbody>
  </table>

  <script src="js/usuarios.js"></script>

</body>
</html>
