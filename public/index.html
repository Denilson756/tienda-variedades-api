<!DOCTYPE html>
<!-- Le dice al navegador que este documento usa HTML5, la versión moderna del estándar -->
<html lang="es">
<!-- <html> envuelve toda la página. lang="es" indica que el contenido está en español (ayuda a lectores de pantalla y a Google) -->

<head>
  <!-- <head> contiene información que el navegador necesita pero que no se muestra directamente en la página -->
  <meta charset="UTF-8">
  <!-- Define la codificación de caracteres, para que tildes y ñ se vean bien -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Hace que la página se vea bien en celulares, ajustando el ancho a la pantalla del dispositivo -->
  <title>Login - Tienda de Variedades</title>
  <!-- El título que aparece en la pestaña del navegador -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Enlaza nuestro archivo de estilos. La ruta es relativa: busca la carpeta css DENTRO de public -->
</head>

<body>
  <!-- <body> es todo lo que SÍ se ve en la página -->

  <h1>Tienda de Variedades</h1>
  <!-- Título principal visible -->

  <form id="form-login">
    <!-- <form> agrupa los campos de entrada. El id "form-login" nos permite luego
         "engancharnos" a este formulario desde JavaScript para controlar qué pasa al enviarlo -->

    <label for="email">Correo:</label>
    <!-- <label> es el texto descriptivo del campo. "for" lo conecta con el input de mismo id,
         así al hacer clic en el texto, el cursor salta directo al campo -->
    <input type="email" id="email" name="email" required>
    <!-- type="email" hace que el navegador valide automáticamente que tenga formato de correo.
         id="email" es lo que usaremos en JS para leer lo que el usuario escribió.
         required impide enviar el formulario si el campo está vacío -->

    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" required>
    <!-- type="password" oculta lo que se escribe (muestra puntos en vez de texto) -->

    <button type="submit">Iniciar sesión</button>
    <!-- type="submit" hace que este botón dispare el evento "submit" del formulario,
         que es lo que vamos a capturar en login.js -->

  </form>

  <p id="mensaje"></p>
  <!-- Espacio vacío donde, desde JavaScript, vamos a escribir mensajes como
       "Credenciales incorrectas" o "Login exitoso" -->

  <script src="js/login.js"></script>
  <!-- Enlaza nuestro archivo de JavaScript. Va AL FINAL del body (no en el head) a propósito:
       así el navegador ya cargó todo el HTML antes de ejecutar el JS que interactúa con él -->

</body>
</html>
